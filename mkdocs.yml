site_name: whatsloon
site_url: https://maharanasarkar.github.io/whatsloon/
repo_url: https://github.com/maharanasarkar/whatsloon
repo_name: maharanasarkar/whatsloon
theme:
  name: material
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Usage: usage.md
  - Messages: messages.md
  - Webhooks: webhooks.md
  - Resources: resources.md
  - Reliability: reliability.md
  - Modern: modern.md
  - Ecosystem: ecosystem.md
  - Admin console: admin.md
  - Architecture: architecture.md
  - Version support: version-support.md
  - API: api.md
  - Changelog: changelog.md
  - ADRs:
    - ADR-001: adr/001-pydantic-src-version-matrix.md
    - ADR-002: adr/002-admin-htmx.md
markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences

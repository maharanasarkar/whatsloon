[build-system]
requires = ["setuptools>=76.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsloon"
version = "3.0.0"
description = "A user-friendly Python wrapper for the WhatsApp Cloud API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Maharana Sarkar", email = "maharana.sarkar2000@gmail.com" }
]
maintainers = [
  { name = "Maharana Sarkar", email = "maharana.sarkar2000@gmail.com" }
]
keywords = [
  "whatsloon",
  "whatsapp",
  "whatsapp-cloud-api",
  "whatsapp-sdk",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.31",
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/maharanasarkar/whatsloon"
Documentation = "https://maharanasarkar.github.io/whatsloon/"
Repository = "https://github.com/maharanasarkar/whatsloon"
Issues = "https://github.com/maharanasarkar/whatsloon/issues"
Changelog = "https://github.com/maharanasarkar/whatsloon/blob/main/CHANGELOG.md"

[project.scripts]
whatsloon = "whatsloon.cli.main:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
]
dev = [
  "whatsloon[test]",
  "ruff>=0.4",
  "black>=24",
  "mypy>=1.10",
  "pre-commit>=3",
  "build>=1",
  "twine>=5",
  "interrogate>=1.7",
  "bandit>=1.7",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
]
sql = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]
admin = [
  "whatsloon[sql]",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
flows = [
  "cryptography>=42",
]
observability = [
  "opentelemetry-api>=1.20",
]
all = [
  "whatsloon[sql,admin,flows,observability]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["whatsloon*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
whatsloon = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["whatsloon"]
branch = true

[tool.coverage.report]
fail_under = 45
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
# Tighten to UP, B, C4, SIM during SDK core revamp; legacy mixins use Dict/List/Optional.

[tool.ruff.lint.per-file-ignores]
"src/whatsloon/*.py" = ["I001", "F401", "W291", "W293"]
"tests/*.py" = ["I001", "E402", "E501", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["whatsloon", "tests"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
exclude = ["tests/", "docs/", "examples/"]

[tool.interrogate]
fail-under = 90
ignore-magic = true
ignore-module = true
ignore-private = true
ignore-property-decorators = true

[tool.build]
# placeholder for build backend config

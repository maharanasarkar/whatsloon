name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: Features
    labels:
      - feat
      - feature
      - enhancement
  - title: Bug Fixes
    labels:
      - fix
      - bug
  - title: Documentation
    labels:
      - docs
      - documentation
  - title: Maintenance
    labels:
      - chore
      - ci
      - tests
      - refactor
      - packaging
template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

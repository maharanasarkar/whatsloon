name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -U pip ruff
      - run: ruff check .
      - run: ruff format --check .

  type:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -U pip mypy .[dev]
      # Legacy 2.x mixins are excluded until Phase 2 migrates them; new core is strict.
      - run: mypy src/whatsloon/exceptions.py src/whatsloon/client.py src/whatsloon/async_client.py src/whatsloon/compat.py src/whatsloon/config src/whatsloon/auth src/whatsloon/transport src/whatsloon/api_versions src/whatsloon/persistence src/whatsloon/admin

  test:
    name: Test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        api-version: ["v19.0", "v26.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -U pip
      - run: pip install .[test]
      - run: pytest --cov --cov-report=xml
        env:
          WHATSLOON_TEST_API_VERSION: ${{ matrix.api-version }}
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12' && matrix.api-version == 'v26.0'
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}-${{ matrix.api-version }}
          path: coverage.xml

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -U pip .[docs] interrogate
      - run: interrogate -v src/whatsloon/
      - run: mkdocs build --strict

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -U pip ruff
      - run: ruff check .
      - run: ruff format --check .

  type:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -U pip .[dev]
      - run: mypy src/whatsloon

  test:
    name: Test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        api-version: ["v19.0", "v20.0", "v26.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -U pip
      - run: pip install .[test] fastapi "sqlalchemy>=2.0" "cryptography>=42" "jinja2>=3.1" "python-multipart>=0.0.18"
      - run: pytest --cov --cov-report=xml
        env:
          WHATSLOON_TEST_API_VERSION: ${{ matrix.api-version }}
      - uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12' && matrix.api-version == 'v26.0'
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}-${{ matrix.api-version }}
          path: coverage.xml

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -U pip .[docs] interrogate
      - run: interrogate -v src/whatsloon/
      - run: mkdocs build --strict

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
